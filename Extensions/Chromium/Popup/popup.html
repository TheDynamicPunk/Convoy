<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Convoy</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --separator: rgba(0, 0, 0, 0.1);
      --track-off: rgba(120, 120, 128, 0.24);
      --accent: #007aff;
      --green: #34c759;
      --orange: #ff9500;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --text: #f5f5f7;
        --secondary: #98989d;
        --separator: rgba(255, 255, 255, 0.1);
        --track-off: rgba(120, 120, 128, 0.36);
        --accent: #0a84ff;
        --green: #30d158;
        --orange: #ff9f0a;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 280px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.35 -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
    }
    .row + .row { border-top: 1px solid var(--separator); }
    .grow { flex: 1; min-width: 0; }
    .icon { width: 28px; height: 28px; }
    .title { font-weight: 600; font-size: 14px; }
    .subtitle, .hint { color: var(--secondary); font-size: 11.5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--secondary); flex: none; }
    .dot.on { background: var(--green); }
    .dot.off { background: var(--orange); }
    .open {
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    .open:disabled { opacity: 0.5; cursor: default; }
    label.row { cursor: pointer; }
    .settings {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-top: 1px solid var(--separator);
      background: none;
      color: var(--secondary);
      font: inherit;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }
    .settings:hover { color: var(--text); }
    .settings svg { flex: none; }

    /* macOS-style switch on a checkbox, so it stays keyboard- and
       screen-reader-accessible. */
    .switch {
      appearance: none;
      flex: none;
      position: relative;
      width: 32px;
      height: 19px;
      border-radius: 10px;
      background: var(--track-off);
      cursor: pointer;
      transition: background 0.15s;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s;
    }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(13px); }
    .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <label class="row">
    <img class="icon" src="../icon128.png" alt="">
    <span class="grow">
      <span class="title">Convoy</span><br>
      <span class="subtitle" id="captureText">Capturing downloads</span>
    </span>
    <input type="checkbox" class="switch" id="captureToggle" aria-label="Capture downloads" checked>
  </label>

  <div class="row">
    <span class="dot" id="statusDot"></span>
    <span class="grow" id="statusText">Checking…</span>
    <button class="open" id="openBtn" hidden>Open</button>
  </div>

  <label class="row">
    <span class="grow">
      Send site cookies<br>
      <span class="hint">For downloads behind a login.</span>
    </span>
    <input type="checkbox" class="switch" id="cookieToggle" aria-label="Send site cookies">
  </label>

  <button class="settings" id="settingsBtn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    Extension settings
  </button>

  <script src="popup.js"></script>
</body>
</html>
